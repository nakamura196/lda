##########
# collectionbuilder-csv
# Jekyll Digital Collection Generator
# https://github.com/CollectionBuilder/collectionbuilder-csv
##########

##########
# URL VARIABLES
#
# site domain, full URL to the production location of your collection
url: https://nakamura196.github.io
# path to location on the domain if necessary e.g. /digital/hjccc
baseurl: /lda
# location of code, the full url to your github repository
source-code: https://github.com/nakamura196/lda

##########
# SITE SETTINGS
#
# language of the site (html lang attribute, UI strings in _data/locale/<lang>.yml)
lang: ja
# interface languages built from this repository, one build per language
# (the English build adds _config.en.yml). Used for the language switch link.
languages:
  - code: ja
    label: 日本語
    baseurl: /lda
  - code: en
    label: English
    baseurl: /lda/en
# title of site appears in banner
title: 地域文化資源デジタルアーカイブ
# tagline, a short phrase that will appear throughout the site in the top banner
tagline: 地域雑誌『谷中・根津・千駄木』1〜10号
# description appears in meta tags and other locations
# this description might appear in search result lists, keep around 160 characters max
description: "1984年に谷根千工房が創刊した地域雑誌『谷中・根津・千駄木』1〜10号の記事446件を、画像・メタデータ・アノテーションとともに公開しています。"
# keywords, a short list of subjects describing the collection, separated by semicolon, to appear in rich markup
keywords: 谷中; 根津; 千駄木; 谷根千; 地域雑誌; 谷根千工房; IIIF
# creator of the digital collection, to appear in meta tags; we typically use our GitHub usernames but feel free to just use your name
author: nakamura196

##########
# COLLECTION SETTINGS
#
# Set the metadata for your collection (the name of the CSV file in your _data directory that describes the objects in your collection) 
# Use the filename of your CSV **without** the ".csv" extension! E.g. _data/demo-metadata.csv --> "demo-metadata"
metadata: yanesen
# page generation settings [optional!]
# [optional: only used if you need to tweak CB defaults or generate from more than one data file]
# page_gen:
#   - data: 'demo-metadata'
#     template: 'item'
#     name: 'objectid'
#     dir: 'items'
#     extension: 'html' 
#     filter: 'objectid'

# IIIF manifests for items whose images are in objects/ (static_iiif gem), at
# /iiif/3/<objectid>/manifest.json and /iiif/2/<objectid>/manifest.json. An item is
# one image (object_location) or a compound object (its child rows, by parentid).
# Items with an external `manifest` keep theirs. Run `rake generate_iiif` to add
# level 0 image services (fixed sizes, tiles for large images).
static_iiif:
  manifests:
    language: ja                 # of the field names; the records' own text is "none"
    summary: description
    rights: rightsstatement
    homepage: items/%{objectid}.html
    provider: true
    required_statement: [利用条件, rights]
    metadata_skip: [title, description]
    # one image at a time: each image is already a whole spread (見開き)
    behavior: individuals
    # text on the images (the old site's annotations): iiif/annotations/<objectid>.csv

##########
# ORGANIZATION SETTINGS
#
# Enter name and link for your organization (replacing the name and links below)
# These values will be used in attribution and data 
organization-name: "地域文化資源デジタルアーカイブ・プロジェクト"
organization-link: https://tcha.jp/pts/lcrd/
# Add logo image links if you would like them to appear in banner and footer. Delete or leave blank to remove logos.
organization-logo-banner:
organization-logo-nav:

##########
# ROBOTS EXCLUDE
#
# set noindex to true if you do NOT want Google to index your site
# noindex: true 

##########
# BUILD SETTINGS 
#
# Note: use environment variable on build command to include analytics
# JEKYLL_ENV=production jekyll build
# (this is done automatically by gh-pages build)
#
# Library directory location. This allows you to customize where the standard assets are found.
# provide a relative path in this repository or full url 
lib-assets: /assets/lib
# ignore stuff
exclude: [vendor/, src/, iiif/annotations/, Rakefile, rakelib/, README.md, LICENSE, CITATION.cff, CODE_OF_CONDUCT.md, CONTRIBUTING.md, SECURITY.md, AGENTS.md, CLAUDE.md, HUMANS.md]
# compress CSS output
sass:
  style: compressed

##########
# CJK SEARCH (cjk_index gem)
#
# Builds assets/cjk-index/search.json (the search index) and
# assets/cjk-index/cjk-index.js (the browser runtime) at build time.
# The collectionbuilder preset reads the same fields as the default search
# (_data/config-search.csv, index = true). Used when search-cjk is true in _data/theme.yml.
cjk_index:
  variants: [ja, zh] # ja: old/new kanji; zh: Traditional/Simplified Chinese (so 实录 finds 実録)
  indexes:
    - name: search
      preset: collectionbuilder
