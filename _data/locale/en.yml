# English UI. Template strings already default to English, so this file only
# overrides the labels that _data/config-*.csv give in Japanese
# (applied by _plugins/cb_i18n.rb), plus strings written for this demo.
config_labels:
  config-nav:
    /: Home
    /browse.html: Browse
    /search/: Search
    /subjects.html: Keywords
    /timeline.html: Timeline
    /map.html: Map
    /data.html: Data
    /about.html: About
  config-metadata:
    title: Title
    issue: Issue
    date: Published
    creator: Author / artist
    subject: Keywords
    description: Contents
    references: References
    note: Type / note
    rights: Rights
    rightsstatement: License
  config-browse:
    issue: { facet_name: Issue }
    creator: { display_name: Author / artist, facet_name: Author / artist }
    note: { facet_name: Type / note }
    subject: { display_name: Keywords, facet_name: Keywords }
  config-map:
    issue: Issue
    date: Published
    creator: Author / artist
    subject: Keywords
  config-table:
    title: Title
    issue: Issue
    creator: Author / artist
    note: Type / note
